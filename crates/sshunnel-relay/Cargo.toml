[package]
name = "sshunnel-relay"
description = "sshunnel's remote half: a small static binary pushed over SSH that dials TCP on the client's behalf."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ssh", "tunnel", "relay"]
categories = ["network-programming", "command-line-utilities"]
include = ["/src/**", "/README.md", "/LICENSE"]

# No clap and no tracing-subscriber: every dependency here crosses the SSH session on a cache miss.
[dependencies]
anyhow.workspace = true
sshunnel-mux.workspace = true
bytes.workspace = true
libc = "0.2"
socket2 = "0.6"
tokio = { workspace = true, features = ["rt", "net", "io-std", "io-util", "sync", "macros", "time"] }

[dev-dependencies]
pretty_assertions = "1"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-std", "io-util", "sync", "macros", "process", "time", "test-util"] }

[lints]
workspace = true
