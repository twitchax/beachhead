name: Build and Test

# Push builds main only, so a branch with an open PR doesn't run everything twice (the
# pull_request event covers it). A newer push cancels the superseded run.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # cargo-binstall queries the GitHub API for release artifacts; the token lifts the anonymous
  # rate limit that otherwise fails installs on busy runners.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ci:
    # Literally the local gate: `cargo make ci` (fmt-check, clippy -D warnings, nextest).
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No `toolchain:` input: the action reads rust-toolchain.toml, the single source of truth.
      # `cache: false` because rust-cache below is configured explicitly; empty `rustflags` because
      # lints are enforced by `cargo make clippy`, and a global -D warnings would also churn the
      # dependency cache.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: cargo-bins/cargo-binstall@main
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          # Tools come from binstall below; caching ~/.cargo/bin restored binstall's manifest
          # without the binaries and broke `cargo nextest` (rusty_socks, 2026-06).
          cache-bin: "false"
      # `--force`: see the comment on the install-* tasks in Makefile.toml.
      - run: cargo binstall cargo-make cargo-nextest --no-confirm --force
      # The login-shell e2e tests skip a missing shell on a dev box but fail under CI.
      - name: Install login shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish tcsh busybox
      # The namespace e2e tests run under `unshare` (user, mount, PID and network namespaces), which
      # Ubuntu's AppArmor blocks by default; this runner is thrown away after the job.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The relay's ping e2es (in the suite) and the root tests open unprivileged ping sockets, which
      # the runner's ping_group_range refuses.
      - name: Allow unprivileged ping
        run: |
          sysctl net.ipv4.ping_group_range
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: cargo make ci
      # The release builds a macOS client (`cargo xtask dist` on macos-15), and every job here runs
      # on Linux, so Linux-only code reaching an always-compiled module would otherwise go unseen
      # until a release. Checking needs only the target's std, no macOS SDK.
      - name: Every crate still builds for macOS
        run: |
          rustup target add x86_64-apple-darwin
          cargo check --workspace --all-targets --target x86_64-apple-darwin
      # The same suite through the Docker fallback a restricted dev box takes, so it can't rot.
      - name: Namespace tests in Docker
        id: route-docker
        run: SSHUNNEL_NETNS=docker cargo nextest run --workspace --test route
      # systemd-resolved serves only the host's namespace, so the name tests run as root on the host.
      # No retries here or below: a flake in a step that runs nowhere else must fail, not pass as
      # FLAKY. No fail-fast either, and the sudo step runs even when this one fails: these run only
      # here, so one push should show every failure.
      - name: Root tests through systemd-resolved
        id: route-root
        run: CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER='sudo -E' cargo nextest run --workspace --run-ignored only -E 'test(/^e2e_route_name|^e2e_resolved/)' --retries 0 --no-fail-fast
      # The path every user takes: route as the runner's own user, through the real sudo (the runner
      # has it passwordless), on a pseudo-terminal, ended by a Ctrl-C typed there.
      - name: Route through sudo on a terminal
        id: route-sudo
        if: ${{ !cancelled() }}
        run: cargo nextest run --workspace --test route_sudo --run-ignored only --retries 0 --no-fail-fast

  codecov:
    name: Code coverage
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: cargo-bins/cargo-binstall@main
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-bin: "false"
      - run: cargo binstall cargo-make cargo-nextest cargo-llvm-cov --no-confirm --force
      - name: Install login shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish tcsh busybox
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The relay's ping e2es (in the suite) open unprivileged ping sockets, which the runner's
      # ping_group_range refuses.
      - name: Allow unprivileged ping
        run: |
          sysctl net.ipv4.ping_group_range
          sudo sysctl -w net.ipv4.ping_group_range="0 2147483647"
      - run: cargo make codecov
      - uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          # Forks have no token; a missing upload shouldn't fail their PR.
          fail_ci_if_error: false

  relay:
    # Each relay builds and runs on its own arch: the aarch64 job is the first place that binary
    # executes. Size and sha256 land in the job summary; the binary is an artifact.
    name: Relay ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          key: relay-${{ matrix.arch }}
      - run: cargo xtask relay --arch ${{ matrix.arch }}
      - name: Probe the relay on its own arch
        run: target/relay/sshunnel-relay-${{ matrix.arch }} --probe
      - name: Summarize
        run: |
          f=target/relay/sshunnel-relay-${{ matrix.arch }}
          {
            echo "### ${{ matrix.arch }} relay"
            echo
            echo "| bytes | sha256 |"
            echo "|---|---|"
            echo "| $(wc -c < "$f") | $(sha256sum "$f" | cut -d' ' -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: sshunnel-relay-${{ matrix.arch }}
          path: target/relay/sshunnel-relay-${{ matrix.arch }}

  audit:
    # RustSec advisories against Cargo.lock; needs no config.
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall cargo-audit --no-confirm --force
      - run: cargo audit
