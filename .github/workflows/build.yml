name: Build and Test

# Push builds main only, so a branch with an open PR doesn't run everything twice (the
# pull_request event covers it). A newer push cancels the superseded run.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # cargo-binstall queries the GitHub API for release artifacts; the token lifts the anonymous
  # rate limit that otherwise fails installs on busy runners.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  ci:
    # Literally the local gate: `cargo make ci` (fmt-check, clippy -D warnings, nextest).
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No `toolchain:` input: the action reads rust-toolchain.toml, the single source of truth.
      # `cache: false` because rust-cache below is configured explicitly; empty `rustflags` because
      # lints are enforced by `cargo make clippy`, and a global -D warnings would also churn the
      # dependency cache.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: cargo-bins/cargo-binstall@main
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          # Tools come from binstall below; caching ~/.cargo/bin restored binstall's manifest
          # without the binaries and broke `cargo nextest` (rusty_socks, 2026-06).
          cache-bin: "false"
      # `--force`: see the comment on the install-* tasks in Makefile.toml.
      - run: cargo binstall cargo-make cargo-nextest --no-confirm --force
      # The login-shell e2e tests skip a missing shell on a dev box but fail under CI.
      - name: Install login shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish tcsh busybox
      - run: cargo make ci

  codecov:
    name: Code coverage
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: cargo-bins/cargo-binstall@main
      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"
          cache-bin: "false"
      - run: cargo binstall cargo-make cargo-nextest cargo-llvm-cov --no-confirm --force
      - name: Install login shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish tcsh busybox
      - run: cargo make codecov
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.lcov
          # Forks have no token; a missing upload shouldn't fail their PR.
          fail_ci_if_error: false

  relay:
    # Each relay builds and runs on its own arch: the aarch64 job is the first place that binary
    # executes. Size and sha256 land in the job summary; the binary is an artifact.
    name: Relay ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          key: relay-${{ matrix.arch }}
      - run: cargo xtask relay --arch ${{ matrix.arch }}
      - name: Probe the relay on its own arch
        run: target/relay/beachhead-relay-${{ matrix.arch }} --probe
      - name: Summarize
        run: |
          f=target/relay/beachhead-relay-${{ matrix.arch }}
          {
            echo "### ${{ matrix.arch }} relay"
            echo
            echo "| bytes | sha256 |"
            echo "|---|---|"
            echo "| $(wc -c < "$f") | $(sha256sum "$f" | cut -d' ' -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: beachhead-relay-${{ matrix.arch }}
          path: target/relay/beachhead-relay-${{ matrix.arch }}

  audit:
    # RustSec advisories against Cargo.lock; needs no config.
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall cargo-audit --no-confirm --force
      - run: cargo audit
