name: Release

# A `v*` tag (from `cargo release`, or by hand) builds the relays once, embeds those same bytes in
# one client per platform, and publishes the clients, the relays and their SHA256SUMS on a GitHub
# Release: one set of hashes per release is the trust story.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  relay:
    name: Relay ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
          rustflags: ""
      - run: cargo xtask relay --arch ${{ matrix.arch }}
      - run: target/relay/sshunnel-relay-${{ matrix.arch }} --probe
      - uses: actions/upload-artifact@v4
        with:
          name: sshunnel-relay-${{ matrix.arch }}
          path: target/relay/sshunnel-relay-${{ matrix.arch }}

  build:
    name: Build ${{ matrix.target }}
    needs: relay
    runs-on: ${{ matrix.os }}
    strategy:
      # Publish whatever platforms succeed instead of cancelling the matrix on one failure.
      fail-fast: false
      matrix:
        include:
          # Linux and macOS only: TUN on Windows would mean wintun, and sshuttle skips Windows too.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          pattern: sshunnel-relay-*
          path: target/relay
          merge-multiple: true
      # Native targets only, so `dist` can run the client and check its embedded relays.
      - run: cargo xtask dist
      - name: Zip the binary
        shell: bash
        run: |
          mkdir -p dist
          cd target/dist
          zip "$GITHUB_WORKSPACE/dist/sshunnel_${{ matrix.target }}.zip" sshunnel
      - uses: actions/upload-artifact@v4
        with:
          name: sshunnel_${{ matrix.target }}
          path: dist/*.zip

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Hash the relays
        run: cd dist && sha256sum sshunnel-relay-* > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip dist/sshunnel-relay-* dist/SHA256SUMS --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
