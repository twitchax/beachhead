# A workspace root from day one, so lints live once in [workspace.lints] and adding an `xtask` or a
# second crate is a one-line change.
[workspace]
members = [".", "crates/sshunnel-mux", "crates/sshunnel-relay", "xtask"]
# Plain `cargo build` / `cargo test` cover the product crates; `--workspace` adds the tooling.
default-members = [".", "crates/sshunnel-mux", "crates/sshunnel-relay"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.91"
authors = ["Aaron Roney <twitchax@gmail.com>"]
license = "MIT"
repository = "https://github.com/twitchax/sshunnel"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
# Each crate opts into exactly the tokio features it needs: the relay's list is its size budget.
tokio = { version = "1", default-features = false }
tracing = "0.1"
sshunnel = { path = ".", version = "0.2.1", default-features = false }
sshunnel-mux = { path = "crates/sshunnel-mux", version = "0.2.1" }

[package]
name = "sshunnel"
description = "A userspace VPN over plain SSH: push-exec a static musl relay, cache it by hash, route through it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ssh", "vpn", "tunnel", "proxy", "networking"]
categories = ["command-line-utilities", "network-programming"]
# /build and /relays arrive with the embedded relays; the tests, PRDs, CI and xtask stay out of the package.
include = ["/src/**", "/build.rs", "/build/**", "/relays/*", "/README.md", "/CHANGELOG.md", "/LICENSE"]

# The release workflow zips the bare `sshunnel` binary at the zip's root. Targets it doesn't build
# compile from source: never a third party's build (QuickInstall) of a tool that pushes binaries.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/sshunnel_{ target }.zip"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
disabled-strategies = ["quick-install"]

[[bin]]
name = "sshunnel"
path = "src/bin.rs"
# The binary needs the `cli` feature; library users who only want the API skip clap entirely.
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:clap_complete", "dep:tracing-subscriber"]
# The fixture factory the repo's own tests share; integration tests link the normal library build, where `cfg(test)` is off.
testing = []

[dependencies]
anyhow.workspace = true
sshunnel-mux.workspace = true
bytes.workspace = true
ipnet = "2"
sha2 = "0.11"
shlex = "2"
simple-dns = "0.12"
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time", "signal"] }
tracing.workspace = true

# cli
clap = { version = "4", features = ["derive", "env"], optional = true }
clap_complete = { version = "4", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

# The root helper (`route::helper`, `route::system`) is Linux only: the TUN ioctl, SO_PEERCRED and
# SCM_RIGHTS, iproute2 and systemd-resolved.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
rustix = { version = "1", features = ["fs", "net", "process", "thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `build.rs` checks the relays it embeds against their `SHA256SUMS`.
[build-dependencies]
sha2 = "0.11"

[dev-dependencies]
# Path-only, so `cargo publish` strips it: the crate's own tests turn the `testing` feature on.
sshunnel = { path = ".", features = ["testing"] }
pretty_assertions = "1"
tempfile = "3"
# Paused time for the netstack's held-SYN and timeout tests.
tokio = { workspace = true, features = ["test-util"] }

# What only the tests need from rustix: a stdin of their choosing for the helper's, and a terminal
# to run `route` on.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "1", features = ["pty", "stdio", "termios"] }

[lints]
workspace = true

# Lints live here, once, and every crate opts in with `[lints] workspace = true` (conclave's
# mechanism; it replaces crate-root `#![deny]` attributes, which drifted between lib.rs and main.rs
# and skipped the xtask crate in razel). Groups sit at priority -1 so a specific lint can override
# them. Gate: `cargo make clippy` (`-D warnings`).
[workspace.lints.rust]
unused = { level = "deny", priority = -1 }
# `cargo llvm-cov` on nightly sets `coverage_nightly`; declare it so check-cfg stays quiet.
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(coverage_nightly)"] }

[workspace.lints.clippy]
# `all` covers conclave's `correctness` + `complexity` (plus `style`, `suspicious`, `perf`).
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Library and binary code returns errors; only tests may unwrap or expect (each test module opens
# with `#![allow(clippy::unwrap_used, clippy::expect_used)]`). Never allow `too_many_lines`,
# `too_many_arguments` or `needless_pass_by_value`: split the function, introduce a struct, or
# take a reference.
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
# Ship size and speed over link time: one codegen unit and fat LTO, symbols stripped.
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Release-like codegen without the expensive LTO / single-CGU link, for quick perf checks.
[profile.dev-release]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
debug = 1
strip = false

# The remote relay crosses the SSH session on every cache miss, so size beats speed. A custom
# profile because per-package overrides can't set `lto` or `panic`: `cargo xtask relay` builds with
# `--profile relay`.
[profile.relay]
inherits = "release"
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1
strip = true

# Release optimizations with full debug info and no LTO, so profilers see legible symbols.
[profile.profiling]
inherits = "release"
debug = 2
lto = false
strip = false
