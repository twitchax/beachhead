# A workspace root from day one, so lints live once in [workspace.lints] and adding an `xtask` or a
# second crate is a one-line change.
[workspace]
members = [".", "crates/beachhead-mux", "crates/beachhead-relay", "xtask"]
# Plain `cargo build` / `cargo test` cover the product crates; `--workspace` adds the tooling.
default-members = [".", "crates/beachhead-mux", "crates/beachhead-relay"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aaron Roney <twitchax@gmail.com>"]
license = "MIT"
repository = "https://github.com/twitchax/beachhead"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
# Each crate opts into exactly the tokio features it needs: the relay's list is its size budget.
tokio = { version = "1", default-features = false }
tracing = "0.1"
beachhead-mux = { path = "crates/beachhead-mux", version = "0.1.0" }

[package]
name = "beachhead"
description = "A userspace VPN over plain SSH: push-exec a static musl relay, cache it by hash, route through it."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = []
categories = []

[[bin]]
name = "beachhead"
path = "src/bin.rs"
# The binary needs the `cli` feature; library users who only want the API skip clap entirely.
required-features = ["cli"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:tracing-subscriber"]

[dependencies]
anyhow.workspace = true
beachhead-mux.workspace = true
bytes.workspace = true
sha2 = "0.11"
shlex = "2"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "process", "io-util", "sync", "time"] }
tracing.workspace = true

# cli
clap = { version = "4", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3"

[lints]
workspace = true

# Lints live here, once, and every crate opts in with `[lints] workspace = true` (conclave's
# mechanism; it replaces crate-root `#![deny]` attributes, which drifted between lib.rs and main.rs
# and skipped the xtask crate in razel). Groups sit at priority -1 so a specific lint can override
# them. Gate: `cargo make clippy` (`-D warnings`).
[workspace.lints.rust]
unused = { level = "deny", priority = -1 }
# `cargo llvm-cov` on nightly sets `coverage_nightly`; declare it so check-cfg stays quiet.
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(coverage_nightly)"] }

[workspace.lints.clippy]
# `all` covers conclave's `correctness` + `complexity` (plus `style`, `suspicious`, `perf`).
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Library and binary code returns errors; only tests may unwrap or expect (each test module opens
# with `#![allow(clippy::unwrap_used, clippy::expect_used)]`). Never allow `too_many_lines`,
# `too_many_arguments` or `needless_pass_by_value`: split the function, introduce a struct, or
# take a reference.
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
# Ship size and speed over link time: one codegen unit and fat LTO, symbols stripped.
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Release-like codegen without the expensive LTO / single-CGU link, for quick perf checks.
[profile.dev-release]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
debug = 1
strip = false

# The remote relay crosses the SSH session on every cache miss, so size beats speed. A custom
# profile because per-package overrides can't set `lto` or `panic`: `cargo xtask relay` builds with
# `--profile relay`.
[profile.relay]
inherits = "release"
opt-level = "z"
panic = "abort"
lto = true
codegen-units = 1
strip = true

# Release optimizations with full debug info and no LTO, so profilers see legible symbols.
[profile.profiling]
inherits = "release"
debug = 2
lto = false
strip = false
